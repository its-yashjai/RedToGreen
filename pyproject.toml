[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "redtogreen"
version = "0.1.0"
description = "An AI agent that turns failing CI builds green: it reads the failure, fixes the bug in a Docker sandbox, and opens a pull request."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "rq>=2.12",
    "docker>=7.2",
    "mcp>=2.3",
    "langgraph>=1.2",
    "openai>=3.24",
    "anthropic>=1.11",
    "pyyaml>=6.0",
    "typer>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[project.scripts]
redtogreen = "redtogreen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redtogreen = ["api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["benchmark/demo_repo", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
