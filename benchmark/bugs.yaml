# 30 seeded bugs for the benchmark. Each bug is applied ALONE to a fresh copy of demo_repo:
# the exact text `find` (must appear exactly once in `file`) is replaced by `replace`.
# The agent never sees this file. `python -m redtogreen.cli bench --verify` checks that every
# bug really makes the test suite fail.

- id: B01
  category: wrong_constant
  file: shopkit/pricing.py
  find: "price * percent / 100"
  replace: "price * percent / 10"

- id: B02
  category: off_by_one
  file: shopkit/pricing.py
  find: "if order_total >= FREE_SHIPPING_ABOVE:"
  replace: "if order_total > FREE_SHIPPING_ABOVE:"

