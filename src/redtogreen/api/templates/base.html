<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RedToGreen{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="top">
    <a href="/" class="brand"><span class="dot red"></span><span class="dot green"></span> RedToGreen</a>
    <span class="tag">turns failing builds green</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
